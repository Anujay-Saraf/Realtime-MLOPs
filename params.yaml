# ============================================================
# DVC Params — single source of truth for tunable values
# ============================================================
# Edit values here, then run `dvc repro` to retrain.
# DVC tracks params across git history: `dvc params diff` shows what changed.
# ============================================================

data:
  num_samples: 12000
  class_balance: 0.65    # P(PASS) — used by generate_dataset.py
  random_state: 42

models:
  model_a:                    # RandomForest
    algorithm: "RandomForestClassifier"
    n_estimators: 500
    max_depth: null
    class_weight: "balanced"
    random_state: 42

  model_b:                    # GradientBoosting
    algorithm: "GradientBoostingClassifier"
    n_estimators: 300
    learning_rate: 0.1
    max_depth: 5
    min_samples_split: 5
    random_state: 42

quality_gate:
  cv_f1_threshold: 0.68     # both models must achieve CV F1 >= this
