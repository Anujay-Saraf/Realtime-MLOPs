# Azure DevOps Pipeline for MLOps
# Deploys the ML pipeline to Azure Container Instances

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - src/*
      - api/*
      - models/*
      - Dockerfile

variables:
  azureSubscription: 'Azure-for-Students'  # Update this with your subscription name
  containerRegistry: 'mlopsregistry'
  containerImageName: 'order-prediction-api'
  containerGroupName: 'order-prediction-api'
  resourceGroupName: 'mlops-rg-free'
  location: 'eastus'

stages:
  - stage: Build
    displayName: 'Build and Push Image'
    jobs:
      - job: Build
        displayName: 'Build Docker Image'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: Docker@2
            displayName: 'Build Docker Image'
            inputs:
              command: build
              dockerfile: '$(Build.SourcesDirectory)/Dockerfile'
              repository: '$(containerRegistry)/$(containerImageName)'
              tags: |
                $(Build.BuildId)
                latest

  - stage: Deploy
    displayName: 'Deploy to Azure Container Instances'
    dependsOn: Build
    jobs:
      - job: Deploy
        displayName: 'Deploy Container'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: AzureCLI@2
            displayName: 'Deploy to Container Instances'
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                az configure --defaults location=$(location)
                az configure --defaults group=$(resourceGroupName)
                
                # Create resource group if not exists
                az group create --name $(resourceGroupName) --location $(location) --output none
                
                # Create container registry
                az acr create --resource-group $(resourceGroupName) --name $(containerRegistry) --sku Basic --output none
                
                # Get ACR credentials
                az acr update -n $(containerRegistry) --admin-enabled true
                ACR_USERNAME=$(az acr credential show --name $(containerRegistry) --query username -o tsv)
                ACR_PASSWORD=$(az acr credential show --name $(containerRegistry) --query passwords[0].value -o tsv)
                
                # Login to ACR
                az acr login --name $(containerRegistry)
                
                # Pull and push image
                docker pull $(containerRegistry).azurecr.io/$(containerImageName):$(Build.BuildId)
                docker tag $(containerRegistry).azurecr.io/$(containerImageName):$(Build.BuildId) $(containerRegistry).azurecr.io/$(containerImageName):latest
                docker push $(containerRegistry).azurecr.io/$(containerImageName):latest
                
                # Deploy to Container Instances
                az container create \
                  --name $(containerGroupName) \
                  --image $(containerRegistry).azurecr.io/$(containerImageName):latest \
                  --cpu 1 \
                  --memory 1 \
                  --registry-login-server $(containerRegistry).azurecr.io \
                  --registry-username $ACR_USERNAME \
                  --registry-password $ACR_PASSWORD \
                  --ip-address public \
                  --ports 8000 \
                  --output table
