# DVC Pipeline — MLOps Training Pipeline
#
# Stages:
#   data   — generate synthetic training data (produces data/orders.csv)
#   train  — train both models (reads data/orders.csv, produces models/*.joblib)
#
# Usage:
#   dvc repro          — re-run the full pipeline if dependencies changed
#   dvc repro train    — re-run only the train stage
#   dvc metrics diff   — compare metrics across runs
#   dvc params diff    — compare hyperparameters across runs

stages:
  data:
    cmd: python src/generate_dataset.py
    deps:
      - src/generate_dataset.py
    params:
      - data.num_samples
      - data.class_balance
    outs:
      - data/orders.csv

  train:
    cmd: python src/train.py
    deps:
      - data/orders.csv
      - src/train.py
    params:
      - models.model_a.n_estimators
      - models.model_a.max_depth
      - models.model_b.n_estimators
      - models.model_b.max_depth
      - quality_gate.cv_f1_threshold
    outs:
      - models/model_a_random_forest.joblib
      - models/model_b_gradient_boosting.joblib
      - models/model_a_random_forest.joblib.meta.json
      - models/model_b_gradient_boosting.joblib.meta.json
