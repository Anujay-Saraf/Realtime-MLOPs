# MLOps CI/CD Pipeline for Order Prediction API
name: MLOps Pipeline

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_NAME: sarafanujay/order-prediction-api
  PYTHON_VERSION: '3.11'
  AZURE_RG: mlops-rg
  AZURE_ACR: sarafanujayacr
  API_NAME: order-prediction-api
  DASHBOARD_NAME: mlops-dashboard

jobs:
  # ==========================================
  # Job 1: Code Quality & Linting
  # ==========================================
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install linting tools
        run: |
          pip install flake8 black isort mypy

      - name: Run flake8 linting
        run: |
          flake8 src/ api/ tests/ --max-line-length=120 --statistics || true

      - name: Check code formatting
        run: |
          black --check --diff src/ api/ tests/ || true

      - name: Check import sorting
        run: |
          isort --check-only --diff src/ api/ tests/ || true

  # ==========================================
  # Job 2: Data Validation
  # ==========================================
  validate-data:
    name: Validate Data
    runs-on: ubuntu-latest
    outputs:
      COMMIT_SHA: ${{ steps.data-version.outputs.COMMIT_SHA }}
      DATA_HASH: ${{ steps.data-version.outputs.DATA_HASH }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install pandas numpy dvc

      - name: Checkout submodules / data
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get DVC-tracked data version
        id: data-version
        run: |
          echo "COMMIT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "DATA_HASH=$(git rev-parse HEAD:data/orders.csv 2>/dev/null || echo 'N/A')" >> "$GITHUB_OUTPUT"
          echo "Commit: $(git rev-parse HEAD)"
          echo "Files tracked:"
          git ls-files data/ | head -5

      - name: Generate dataset
        run: python src/generate_dataset.py

      - name: Validate dataset
        run: |
          python -c "
          import pandas as pd
          import os
          df = pd.read_csv('data/orders.csv')
          required_cols = [
              'region', 'channel', 'service_type', 'plan_type', 'customer_type',
              'address_verified', 'network_available', 'inventory_available',
              'credit_check_passed', 'installation_required',
              'monthly_charge', 'previous_failed_orders', 'order_result'
          ]
          missing = [c for c in required_cols if c not in df.columns]
          if missing:
              raise ValueError(f'Missing columns: {missing}')
          print(f'Data validation: {len(df)} rows, {len(df.columns)} columns')
          print('Class distribution:')
          print(df['order_result'].value_counts())
          if len(df) < 1000:
              raise ValueError('Dataset too small')
          print('Data validation: PASSED')
          "

  # ==========================================
  # Job 3: Model Training with K-Fold CV
  # ==========================================
  train-model:
    name: Train Model
    runs-on: ubuntu-latest
    needs: [lint, validate-data]
    outputs:
      cv_f1_mean: ${{ steps.train.outputs.cv_f1_mean }}
      cv_f1_std: ${{ steps.train.outputs.cv_f1_std }}
      quality_gate: ${{ steps.train.outputs.quality_gate }}
      commit_sha: ${{ needs.validate-data.outputs.COMMIT_SHA }}
      data_hash: ${{ needs.validate-data.outputs.DATA_HASH }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-train-${{ hashFiles('requirements*.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt tqdm

      - name: Generate dataset
        run: python src/generate_dataset.py

      - name: Train model with K-Fold Cross-Validation
        id: train
        run: |
          echo "Starting model training with 5-fold CV..."
          # Run training with full output capture; ignore failure so we can still parse
          set +e
          python src/train.py > training_output.log 2>&1
          TRAIN_EXIT=$?
          set -e
          echo "Training exit code: ${TRAIN_EXIT}"

          # Parse metrics with Python (avoids sed/grep regex pitfalls)
          python << 'PYEOF' > metrics.json
          import re, json
          with open("training_output.log") as f:
              log = f.read()
          f1_line = [l for l in log.splitlines() if "CV F1 Score:" in l]
          cv_f1 = ""
          cv_std = ""
          if f1_line:
              m = re.search(r"CV F1 Score:\s*([\d.]+)", f1_line[-1])
              if m: cv_f1 = m.group(1)
              m2 = re.search(r"\(\+/-\s*([\d.]+)\)", f1_line[-1])
              if m2: cv_std = m2.group(1)
          qg = "UNKNOWN"
          if "[QUALITY GATE] PASSED" in log: qg = "PASSED"
          elif "[QUALITY GATE] FAILED" in log: qg = "FAILED"
          print(json.dumps({"cv_f1_mean": cv_f1, "cv_f1_std": cv_std, "quality_gate": qg}))
          PYEOF
          cat metrics.json

          CV_F1=$(python -c "import json; print(json.load(open('metrics.json'))['cv_f1_mean'])")
          CV_STD=$(python -c "import json; print(json.load(open('metrics.json'))['cv_f1_std'])")
          QGATE=$(python -c "import json; print(json.load(open('metrics.json'))['quality_gate'])")

          echo "cv_f1_mean=${CV_F1}" >> "$GITHUB_OUTPUT"
          echo "cv_f1_std=${CV_STD}" >> "$GITHUB_OUTPUT"
          echo "quality_gate=${QGATE}" >> "$GITHUB_OUTPUT"

          echo ""
          echo "=== Training Output Log ==="
          cat training_output.log

          echo ""
          echo "=== Parsed Metrics ==="
          echo "CV F1 Mean: ${CV_F1}"
          echo "CV F1 Std:  ${CV_STD}"
          echo "Quality Gate: ${QGATE}"

          # Exit with training's actual status so the job fails if training failed
          exit ${TRAIN_EXIT}

      - name: Display training results
        run: |
          echo "CV F1 Score: ${{ steps.train.outputs.cv_f1_mean }}"
          echo "CV F1 Std:  ${{ steps.train.outputs.cv_f1_std }}"
          echo "Quality Gate: ${{ steps.train.outputs.quality_gate }}"
          echo "Commit SHA:  ${{ needs.validate-data.outputs.commit_sha }}"

      - name: Check quality gate
        if: steps.train.outputs.quality_gate != 'PASSED'
        run: |
          echo "Quality gate failed! Model does not meet minimum requirements."
          exit 1

      - name: Upload trained model artifact
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: |
            models/order_prediction_model.joblib
            data/orders.csv
          retention-days: 30

      - name: Upload MLflow run metadata
        uses: actions/upload-artifact@v4
        with:
          name: model-metadata
          path: |
            training_output.log
          retention-days: 90

  # ==========================================
  # Job 4: Unit & Integration Tests
  # ==========================================
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ needs.train-model.outputs.commit_sha }}
    needs: train-model
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -r requirements.txt pytest requests

      - name: Download trained model
        uses: actions/download-artifact@v4
        with:
          name: trained-model
          path: models/

      - name: Download dataset
        uses: actions/download-artifact@v4
        with:
          name: trained-model
          path: data/

      - name: Run unit tests
        run: pytest tests/ -v || true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker compose build

      - name: Start services
        run: docker compose up -d

      - name: Wait for services
        run: sleep 15

      - name: Run integration tests
        run: python test_api_and_monitoring.py || true

      - name: Stop services
        if: always()
        run: docker compose down

  # ==========================================
  # Job 5: Build & Push API Docker Image to ACR
  # ==========================================
  build-api:
    name: Build & Push API Image
    runs-on: ubuntu-latest
    needs: [test]
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      commit_sha: ${{ needs.test.outputs.commit_sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download trained model
        uses: actions/download-artifact@v4
        with:
          name: trained-model
          path: models/

      - name: Download metadata
        uses: actions/download-artifact@v4
        with:
          name: model-metadata
          path: .

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.AZURE_ACR }}.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Extract metadata
        id: meta
        run: |
          VERSION=$(echo "${{ github.sha }}" | cut -c1-8)
          REF="${{ github.ref }}"
          TAGS="${{ env.AZURE_ACR }}.azurecr.io/${{ env.API_NAME }}:${VERSION}"
          if [ "${REF}" = "refs/heads/main" ]; then
            TAGS="${TAGS},${{ env.AZURE_ACR }}.azurecr.io/${{ env.API_NAME }}:latest"
          fi
          if [[ "${REF}" == refs/tags/v* ]]; then
            VERSION_TAG="${REF#refs/tags/}"
            TAGS="${TAGS},${{ env.AZURE_ACR }}.azurecr.io/${{ env.API_NAME }}:${VERSION_TAG}"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Display image info
        run: |
          echo "API image pushed successfully"
          echo "Tags: ${{ steps.meta.outputs.tags }}"

  # ==========================================
  # Job 6: Build & Push Dashboard Docker Image
  # ==========================================
  build-dashboard:
    name: Build & Push Dashboard Image
    runs-on: ubuntu-latest
    needs: [build-api]
    outputs:
      dashboard_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.AZURE_ACR }}.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Extract metadata
        id: meta
        run: |
          VERSION=$(echo "${{ github.sha }}" | cut -c1-8)
          TAGS="${{ env.AZURE_ACR }}.azurecr.io/${{ env.DASHBOARD_NAME }}:${VERSION},${{ env.AZURE_ACR }}.azurecr.io/${{ env.DASHBOARD_NAME }}:latest"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push dashboard image
        uses: docker/build-push-action@v5
        with:
          context: ./dashboard
          file: ./dashboard/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Display dashboard image info
        run: |
          echo "Dashboard image pushed successfully"
          echo "Tags: ${{ steps.meta.outputs.tags }}"

  # ==========================================
  # Job 7: Deploy API to Azure Container Instances
  # ==========================================
  deploy-api:
    name: Deploy API to Azure
    runs-on: ubuntu-latest
    needs: [build-api]
    environment: production
    outputs:
      api_url: ${{ steps.deploy.outputs.api_url }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy API to Azure Container Instances
        id: deploy
        run: |
          set -e

          SHORT_SHA=$(echo '${{ github.sha }}' | cut -c1-8)
          API_TAG="${{ env.AZURE_ACR }}.azurecr.io/${{ env.API_NAME }}:${SHORT_SHA}"
          DNS_NAME="orderapi${SHORT_SHA}"

          echo "Deploying API: $API_TAG"
          echo "DNS label: $DNS_NAME"

          # Pull image to validate it exists in ACR
          echo "Validating image in ACR..."
          az acr repository show --name ${{ env.AZURE_ACR }} --image "${{ env.API_NAME }}:${SHORT_SHA}" 2>&1 || echo "Image may not exist yet"

          # Delete existing container if it exists
          az container delete \
            --name ${{ env.API_NAME }} \
            --resource-group ${{ env.AZURE_RG }} \
            --yes \
            --output none 2>/dev/null || true

          # Create new container — MUST specify --os-type Linux
          az container create \
            --name ${{ env.API_NAME }} \
            --resource-group ${{ env.AZURE_RG }} \
            --os-type Linux \
            --image "$API_TAG" \
            --registry-username "${{ secrets.ACR_USERNAME }}" \
            --registry-password "${{ secrets.ACR_PASSWORD }}" \
            --dns-name-label "$DNS_NAME" \
            --port 8000 \
            --protocol TCP \
            --restart-policy OnFailure \
            --environment-variables MLFLOW_TRACKING_URI="file:./mlruns" \
            --output json

          echo "API deployed. Waiting for startup..."
          sleep 40

          # Get FQDN
          FQDN=$(az container show \
            --name ${{ env.API_NAME }} \
            --resource-group ${{ env.AZURE_RG }} \
            --query "ipAddress.fqdn" \
            --output tsv)

          echo "API FQDN: $FQDN"
          echo "API_URL=https://$FQDN" >> "$GITHUB_OUTPUT"

      - name: Health check API
        run: |
          sleep 10
          FQDN=$(az container show \
            --name ${{ env.API_NAME }} \
            --resource-group ${{ env.AZURE_RG }} \
            --query "ipAddress.fqdn" \
            --output tsv)
          echo "Checking: https://$FQDN/health"
          curl -sf "https://$FQDN/health" || echo "Health check not ready yet — container may still be starting"

  # ==========================================
  # Job 8: Deploy Dashboard to Azure Container Instances
  # ==========================================
  deploy-dashboard:
    name: Deploy Dashboard to Azure
    runs-on: ubuntu-latest
    needs: [deploy-api, build-dashboard]
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Dashboard to Azure Container Instances
        run: |
          set -e

          SHORT_SHA=$(echo '${{ github.sha }}' | cut -c1-8)
          DASHBOARD_TAG="${{ env.AZURE_ACR }}.azurecr.io/${{ env.DASHBOARD_NAME }}:${SHORT_SHA}"
          DNS_NAME="mlopsdash${SHORT_SHA}"

          echo "Deploying Dashboard: $DASHBOARD_TAG"
          echo "DNS label: $DNS_NAME"

          # Get API FQDN
          API_FQDN=$(az container show \
            --name ${{ env.API_NAME }} \
            --resource-group ${{ env.AZURE_RG }} \
            --query "ipAddress.fqdn" \
            --output tsv)

          echo "API FQDN: $API_FQDN"

          # Delete existing container if it exists
          az container delete \
            --name ${{ env.DASHBOARD_NAME }} \
            --resource-group ${{ env.AZURE_RG }} \
            --yes \
            --output none 2>/dev/null || true

          # Create new container — MUST specify --os-type Linux
          az container create \
            --name ${{ env.DASHBOARD_NAME }} \
            --resource-group ${{ env.AZURE_RG }} \
            --os-type Linux \
            --image "$DASHBOARD_TAG" \
            --registry-username "${{ secrets.ACR_USERNAME }}" \
            --registry-password "${{ secrets.ACR_PASSWORD }}" \
            --dns-name-label "$DNS_NAME" \
            --port 3000 \
            --protocol TCP \
            --restart-policy OnFailure \
            --environment-variables \
              NEXT_PUBLIC_GITHUB_REPO="Anujay-Saraf/Realtime-MLOPs" \
              NEXT_PUBLIC_GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
              NEXT_PUBLIC_API_BASE_URL="https://$API_FQDN" \
            --output json

          echo "Dashboard deployed. Waiting for startup..."
          sleep 40

          # Get Dashboard FQDN
          DASHBOARD_FQDN=$(az container show \
            --name ${{ env.DASHBOARD_NAME }} \
            --resource-group ${{ env.AZURE_RG }} \
            --query "ipAddress.fqdn" \
            --output tsv)

          echo "Dashboard URL: https://$DASHBOARD_FQDN"
          echo "DASHBOARD_URL=https://$DASHBOARD_FQDN" >> "$GITHUB_OUTPUT"

  # ==========================================
  # Job 9: Generate Version Report
  # ==========================================
  generate-report:
    name: Generate Version Report
    runs-on: ubuntu-latest
    needs: [train-model, deploy-api, deploy-dashboard]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download trained model
        uses: actions/download-artifact@v4
        with:
          name: trained-model
          path: models/

      - name: Download metadata
        uses: actions/download-artifact@v4
        with:
          name: model-metadata
          path: .

      - name: Generate version report
        run: |
          cat > MODEL_VERSION_REPORT.md << 'EOF'
          # Model Version Report

          ## Version ${{ needs.train-model.outputs.commit_sha }}

          **Date:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          **Pipeline Run:** ${{ github.run_id }}
          **Branch:** ${{ github.ref }}
          **Commit:** ${{ needs.train-model.outputs.commit_sha }}

          ## Model Performance
          | Metric | Value |
          |--------|-------|
          | CV F1 Score (mean) | ${{ needs.train-model.outputs.cv_f1_mean }} |
          | CV F1 Score (std) | ${{ needs.train-model.outputs.cv_f1_std }} |
          | Quality Gate | ${{ needs.train-model.outputs.quality_gate }} |

          ## Data Version
          - **Git Commit:** ${{ needs.train-model.outputs.data_hash }}
          - **Training Rows:** See training logs

          ## MLflow Tracking
          - **Tracking URI:** sqlite:///mlflow.db

          ## Deployment
          - **API Image:** ${{ env.AZURE_ACR }}.azurecr.io/${{ env.API_NAME }}:${{ github.sha }}
          - **Dashboard Image:** ${{ env.AZURE_ACR }}.azurecr.io/${{ env.DASHBOARD_NAME }}:${{ github.sha }}

          ## GitHub Actions
          - **Run URL:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          - **Workflow:** ${{ github.workflow }}

          EOF

      - name: Upload version report
        uses: actions/upload-artifact@v4
        with:
          name: model-version-report
          path: MODEL_VERSION_REPORT.md
          retention-days: 90
