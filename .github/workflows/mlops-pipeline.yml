# MLOps CI/CD Pipeline for Order Prediction API
name: MLOps Pipeline

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: mlops-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: docker.io
  IMAGE_NAME: sarafanujay/order-prediction-api
  PYTHON_VERSION: '3.11'
  AZURE_RG: mlops-rg
  AZURE_ACR: sarafanujayacr
  AZURE_ACR_LOGIN_SERVER: sarafanujayacr.azurecr.io
  API_NAME: order-prediction-api
  DASHBOARD_NAME: mlops-dashboard
  AZURE_STORAGE_CONTAINER: dvcremote
  AZURE_STORAGE_PATH_PREFIX: mlops

jobs:
  # ==========================================
  # Job 1: Code Quality & Linting
  # ==========================================
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install linting tools
        run: |
          pip install flake8 black isort mypy

      - name: Run flake8 linting
        run: |
          # Report lint issues but don't fail the pipeline on style nits.
          # We treat real syntax errors / undefined names as hard failures
          # by selecting only E9,F63,F7,F82 — see flake8 docs.
          flake8 src/ api/ tests/ --max-line-length=120 --select=E9,F63,F7,F82 --statistics
          echo "Lint passed (style warnings ignored — E9/F63/F7/F82 enforced)"

      - name: Check code formatting
        run: |
          # Advisory only — black formatting drift does not block deployment.
          black --check --diff src/ api/ tests/ || echo "black: reformat suggestions above (advisory)"

      - name: Check import sorting
        run: |
          # Advisory only — isort drift does not block deployment.
          isort --check-only --diff src/ api/ tests/ || echo "isort: reorder suggestions above (advisory)"

  # ==========================================
  # Job 2: Data Validation
  # ==========================================
  validate-data:
    name: Validate Data
    runs-on: ubuntu-latest
    outputs:
      COMMIT_SHA: ${{ steps.data-version.outputs.COMMIT_SHA }}
      DATA_HASH: ${{ steps.data-version.outputs.DATA_HASH }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install pandas numpy dvc

      - name: Get dataset version
        id: data-version
        run: |
          echo "COMMIT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "DATA_HASH=$(git rev-parse HEAD:data/orders.csv 2>/dev/null || echo 'N/A')" >> "$GITHUB_OUTPUT"
          echo "Commit: $(git rev-parse HEAD)"

      - name: Generate dataset
        run: python src/generate_dataset.py

      - name: Validate dataset
        run: |
          python -c "
          import pandas as pd
          import os
          df = pd.read_csv('data/orders.csv')
          required_cols = [
              'region', 'channel', 'service_type', 'plan_type', 'customer_type',
              'address_verified', 'network_available', 'inventory_available',
              'credit_check_passed', 'installation_required',
              'monthly_charge', 'previous_failed_orders', 'order_result'
          ]
          missing = [c for c in required_cols if c not in df.columns]
          if missing:
              raise ValueError(f'Missing columns: {missing}')
          print(f'Data validation: {len(df)} rows, {len(df.columns)} columns')
          print('Class distribution:')
          print(df['order_result'].value_counts())
          if len(df) < 1000:
              raise ValueError('Dataset too small')
          print('Data validation: PASSED')
          "

  # ==========================================
  # Job 3: Model Training with K-Fold CV
  # ==========================================
  train-model:
    name: Train Models (A & B)
    runs-on: ubuntu-latest
    needs: [lint, validate-data]
    outputs:
      cv_f1_mean: ${{ steps.train.outputs.cv_f1_mean }}
      cv_f1_std: ${{ steps.train.outputs.cv_f1_std }}
      quality_gate: ${{ steps.train.outputs.quality_gate }}
      commit_sha: ${{ needs.validate-data.outputs.COMMIT_SHA }}
      data_hash: ${{ needs.validate-data.outputs.DATA_HASH }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-train-${{ hashFiles('requirements*.txt') }}

      - name: Install dependencies
        run: |
          pip install --default-timeout=600 --retries 5 -r requirements.txt tqdm

      - name: Pull data and models from DVC remote (Azure Blob)
        run: |
          # DVC config + .dvc pointers are git-tracked. Only the connection
          # string is in .dvc/config.local (gitignored) so the runner can't
          # pull by default. Inject it from the secret so `dvc pull` works.
          mkdir -p .dvc
          cat > .dvc/config.local << EOF
          [core]
              remote = origin
          ['remote "origin"']
              url = azure://${{ env.AZURE_STORAGE_CONTAINER }}/${{ env.AZURE_STORAGE_PATH_PREFIX }}
              connection_string = ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
              allow_anonymous_login = false
          EOF
          dvc pull --force 2>&1 || echo "dvc pull skipped (no remote data yet — will generate locally)"

      - name: Generate dataset
        run: python src/generate_dataset.py

      - name: Restore trained model cache
        id: model-cache
        uses: actions/cache@v4
        with:
          path: models
          key: ${{ runner.os }}-python-${{ env.PYTHON_VERSION }}-models-${{ hashFiles('data/orders.csv', 'params.yaml', 'src/generate_dataset.py', 'src/train.py', 'requirements.txt') }}

      - name: Train both models (RandomForest + GradientBoosting)
        id: train
        run: |
          if [ "${{ steps.model-cache.outputs.cache-hit }}" = "true" ]; then
            echo "Exact trained-model cache hit; validating cached artifacts instead of retraining."
            set +e
            python << 'PYEOF' > training_output.log
          import hashlib
          import json
          from pathlib import Path
          import joblib
          import pandas as pd
          import yaml

          data_path = Path("data/orders.csv")
          data_hash = hashlib.sha256(data_path.read_bytes()).hexdigest()[:12]
          threshold = yaml.safe_load(Path("params.yaml").read_text())["quality_gate"]["cv_f1_threshold"]
          metadata_paths = [
              Path("models/model_a_random_forest.joblib.meta.json"),
              Path("models/model_b_gradient_boosting.joblib.meta.json"),
          ]
          model_paths = [
              Path("models/model_a_random_forest.joblib"),
              Path("models/model_b_gradient_boosting.joblib"),
          ]

          if not all(path.is_file() for path in model_paths + metadata_paths):
              raise SystemExit("Cached model files are incomplete")

          metadata = [json.loads(path.read_text()) for path in metadata_paths]
          if any(item.get("dataset_sha") != data_hash for item in metadata):
              raise SystemExit("Cached models do not match the generated dataset")
          if any(float(item.get("cv_f1_mean", 0)) < threshold or item.get("quality_gate") != "PASSED" for item in metadata):
              raise SystemExit("Cached models do not pass the current quality gate")

            # Deserialization and a real prediction check catch truncated or
            # incompatible joblib files that metadata-only checks cannot detect.
            data = pd.read_csv(data_path)
            features = data.drop(columns=["order_result"]).head(8)
            for model_path in model_paths:
              loaded_model = joblib.load(model_path)
              predictions = loaded_model.predict(features)
              if len(predictions) != len(features):
                raise SystemExit(f"Cached model produced an invalid prediction count: {model_path}")
              if any(int(prediction) not in (0, 1) for prediction in predictions):
                raise SystemExit(f"Cached model produced invalid prediction values: {model_path}")

          for item in metadata:
              print(f"  CV F1 Score: {item['cv_f1_mean']:.4f} (+/- {item['cv_f1_std']:.4f})")
          print("[QUALITY GATE] PASSED: both cached models meet minimum F1")
          PYEOF
            CACHE_VALIDATION_EXIT=$?
            set -e
            if [ "${CACHE_VALIDATION_EXIT}" -eq 0 ]; then
              TRAIN_EXIT=0
            else
              echo "Cached artifacts failed validation; retraining models."
              python src/train.py > training_output.log 2>&1
              TRAIN_EXIT=$?
            fi
          else
            echo "No exact trained-model cache entry; starting model training with 5-fold CV (A & B)..."
            set +e
            python src/train.py > training_output.log 2>&1
            TRAIN_EXIT=$?
            set -e
          fi
          echo "Training exit code: ${TRAIN_EXIT}"

          # Parse metrics for the LAST model in the log (Model B)
          python << 'PYEOF' > metrics.json
          import re, json
          with open("training_output.log") as f:
              log = f.read()

          f1_lines = [l for l in log.splitlines() if "CV F1 Score:" in l]
          cv_f1, cv_std = "", ""
          if f1_lines:
              last = f1_lines[-1]
              m = re.search(r"CV F1 Score:\s*([\d.]+)", last)
              if m: cv_f1 = m.group(1)
              m2 = re.search(r"\(\+/-\s*([\d.]+)\)", last)
              if m2: cv_std = m2.group(1)

          qg = "UNKNOWN"
          if "[QUALITY GATE] PASSED" in log: qg = "PASSED"
          elif "[QUALITY GATE] FAILED" in log: qg = "FAILED"

          print(json.dumps({"cv_f1_mean": cv_f1, "cv_f1_std": cv_std, "quality_gate": qg}))
          PYEOF
          cat metrics.json

          CV_F1=$(python -c "import json; print(json.load(open('metrics.json'))['cv_f1_mean'])")
          CV_STD=$(python -c "import json; print(json.load(open('metrics.json'))['cv_f1_std'])")
          QGATE=$(python -c "import json; print(json.load(open('metrics.json'))['quality_gate'])")

          echo "cv_f1_mean=${CV_F1}" >> "$GITHUB_OUTPUT"
          echo "cv_f1_std=${CV_STD}" >> "$GITHUB_OUTPUT"
          echo "quality_gate=${QGATE}" >> "$GITHUB_OUTPUT"

          echo "=== Training Output Log (last 80 lines) ==="
          tail -80 training_output.log

          echo "=== Parsed Metrics ==="
          echo "CV F1 Mean: ${CV_F1}"
          echo "CV F1 Std:  ${CV_STD}"
          echo "Quality Gate: ${QGATE}"

          # Verify both model files were produced
          ls -la models/
          if [ ! -f "models/model_a_random_forest.joblib" ]; then
            echo "ERROR: Model A not produced"; exit 1
          fi
          if [ ! -f "models/model_b_gradient_boosting.joblib" ]; then
            echo "ERROR: Model B not produced"; exit 1
          fi

          exit ${TRAIN_EXIT}

      - name: Check quality gate
        if: steps.train.outputs.quality_gate != 'PASSED'
        run: |
          echo "Quality gate failed! Model does not meet minimum requirements."
          exit 1

      - name: Upload trained models (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: trained-models
          path: |
            models/model_a_random_forest.joblib
            models/model_a_random_forest.joblib.meta.json
            models/model_b_gradient_boosting.joblib
            models/model_b_gradient_boosting.joblib.meta.json
            data/orders.csv
          retention-days: 30

      - name: Push data + models to DVC remote (Azure Blob)
        run: |
          # Only push if quality gate passed — never poison the remote with
          # a regressed model.
          if [ "${{ steps.train.outputs.quality_gate }}" = "PASSED" ]; then
            dvc push 2>&1 || echo "WARNING: dvc push failed (non-fatal)"
          else
            echo "Skipping dvc push — quality gate FAILED"
          fi

      - name: Upload training logs
        uses: actions/upload-artifact@v4
        with:
          name: training-logs
          path: training_output.log
          retention-days: 30

  # ==========================================
  # Job 4: Unit & Integration Tests
  # ==========================================
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    needs: train-model
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -r requirements.txt pytest requests

      - name: Download trained models
        uses: actions/download-artifact@v4
        with:
          name: trained-models
          path: .

      - name: Run pytest (uses downloaded models, no docker needed)
        run: |
          pytest tests/ -v

  # ==========================================
  # Job 5: Build & Push API Docker Image to ACR
  # ==========================================
  build-api:
    name: Build & Push API Image
    runs-on: ubuntu-latest
    needs: [test]
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download trained models
        uses: actions/download-artifact@v4
        with:
          name: trained-models
          path: .

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.AZURE_ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Extract image metadata
        id: meta
        run: |
          SHORT=$(echo "${{ github.sha }}" | cut -c1-8)
          TAGS="${{ env.AZURE_ACR_LOGIN_SERVER }}/${{ env.API_NAME }}:${SHORT}"
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            TAGS="${TAGS},${{ env.AZURE_ACR_LOGIN_SERVER }}/${{ env.API_NAME }}:latest"
          fi
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION_TAG="${REF#refs/tags/}"
            TAGS="${TAGS},${{ env.AZURE_ACR_LOGIN_SERVER }}/${{ env.API_NAME }}:${VERSION_TAG}"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT}" >> "$GITHUB_OUTPUT"

      - name: Verify model files exist
        run: |
          echo "Checking models/ directory..."
          ls -lh models/
          for f in model_a_random_forest.joblib model_b_gradient_boosting.joblib; do
            if [ ! -f "models/${f}" ]; then
              echo "ERROR: models/${f} not found"
              exit 1
            fi
          done
          echo "All model files verified."

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=api-${{ github.run_id }}
          cache-to: type=gha,mode=max,scope=api-${{ github.run_id }}
          provenance: false

  # ==========================================
  # Job 6: Build & Push Dashboard Docker Image
  # ==========================================
  build-dashboard:
    name: Build & Push Dashboard Image
    runs-on: ubuntu-latest
    needs: [build-api]
    outputs:
      dashboard_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.AZURE_ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Extract image metadata
        id: meta
        run: |
          SHORT=$(echo "${{ github.sha }}" | cut -c1-8)
          TAGS="${{ env.AZURE_ACR_LOGIN_SERVER }}/${{ env.DASHBOARD_NAME }}:${SHORT},${{ env.AZURE_ACR_LOGIN_SERVER }}/${{ env.DASHBOARD_NAME }}:latest"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push dashboard image
        uses: docker/build-push-action@v5
        with:
          context: ./dashboard
          file: ./dashboard/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=dash-${{ github.run_id }}
          cache-to: type=gha,mode=max,scope=dash-${{ github.run_id }}
          provenance: false

  # ==========================================
  # Job 7: Deploy API to Azure Container Instances
  # ==========================================
  deploy-api:
    name: Deploy API to Azure
    runs-on: ubuntu-latest
    needs: [build-api]
    environment: production
    outputs:
      api_url: ${{ steps.deploy.outputs.api_url }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy API to Azure Container Instances
        id: deploy
        run: |
          set -e
          SHORT_SHA="${{ needs.build-api.outputs.short_sha }}"
          API_TAG="${{ env.AZURE_ACR_LOGIN_SERVER }}/${{ env.API_NAME }}:${SHORT_SHA}"
          DNS_NAME="orderapi${SHORT_SHA}"

          echo "Deploying API: $API_TAG"
          echo "DNS label: $DNS_NAME"

          # Pull image to validate it exists in ACR
          az acr repository show --name ${{ env.AZURE_ACR }} --image "${{ env.API_NAME }}:${SHORT_SHA}"

          # Delete existing container if it exists
          az container delete \
            --name ${{ env.API_NAME }} \
            --resource-group ${{ env.AZURE_RG }} \
            --yes \
            --output none 2>/dev/null || true

          # Create new container
          az container create \
            --name ${{ env.API_NAME }} \
            --resource-group ${{ env.AZURE_RG }} \
            --os-type Linux \
            --image "$API_TAG" \
            --registry-username "${{ secrets.ACR_USERNAME }}" \
            --registry-password "${{ secrets.ACR_PASSWORD }}" \
            --dns-name-label "$DNS_NAME" \
            --ports 8000 \
            --cpu 1 \
            --memory 1.5 \
            --restart-policy Always \
            --output json

          # Poll for FQDN (don't sleep 40; poll every 5s for up to 90s)
          for i in $(seq 1 18); do
            FQDN=$(az container show \
              --name ${{ env.API_NAME }} \
              --resource-group ${{ env.AZURE_RG }} \
              --query "ipAddress.fqdn" \
              --output tsv 2>/dev/null || true)
            if [ -n "$FQDN" ] && [ "$FQDN" != "null" ]; then
              break
            fi
            sleep 5
          done

          echo "API FQDN: $FQDN"
          echo "api_url=http://$FQDN:8000" >> "$GITHUB_OUTPUT"

      - name: Health check API
        run: |
          FQDN="${{ steps.deploy.outputs.api_url }}"
          echo "Checking: ${FQDN}/health"
          # Poll /health every 5s for up to 60s (cold start for ~130MB model)
          HEALTHY=""
          for i in $(seq 1 12); do
            if curl -sf "${FQDN}/health" > /dev/null; then
              HEALTHY="yes"
              break
            fi
            echo "  attempt $i: not ready yet, waiting 5s..."
            sleep 5
          done
          if [ "$HEALTHY" = "yes" ]; then
            echo "✅ API is healthy at ${FQDN}"
          else
            echo "⚠️ API not healthy yet at ${FQDN}, may still be starting"
            exit 1
          fi

  # ==========================================
  # Job 8: Deploy Dashboard to Azure Container Instances
  # ==========================================
  deploy-dashboard:
    name: Deploy Dashboard to Azure
    runs-on: ubuntu-latest
    needs: [deploy-api, build-dashboard]
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Dashboard to Azure Container Instances
        run: |
          set -e
          SHORT_SHA="${{ needs.build-api.outputs.short_sha }}"
          DASHBOARD_TAG="${{ env.AZURE_ACR_LOGIN_SERVER }}/${{ env.DASHBOARD_NAME }}:${SHORT_SHA}"
          DNS_NAME="mlopsdash${SHORT_SHA}"
          API_FQDN="${{ needs.deploy-api.outputs.api_url }}"

          echo "Deploying Dashboard: $DASHBOARD_TAG"
          echo "DNS label: $DNS_NAME"
          echo "API FQDN: $API_FQDN"

          # Delete existing container
          az container delete \
            --name ${{ env.DASHBOARD_NAME }} \
            --resource-group ${{ env.AZURE_RG }} \
            --yes \
            --output none 2>/dev/null || true

          # Create new container — pass API URL + GitHub repo at runtime
          az container create \
            --name ${{ env.DASHBOARD_NAME }} \
            --resource-group ${{ env.AZURE_RG }} \
            --os-type Linux \
            --image "$DASHBOARD_TAG" \
            --registry-username "${{ secrets.ACR_USERNAME }}" \
            --registry-password "${{ secrets.ACR_PASSWORD }}" \
            --dns-name-label "$DNS_NAME" \
            --ports 3000 \
            --cpu 1 \
            --memory 1.5 \
            --restart-policy Always \
            --environment-variables \
              NEXT_PUBLIC_GITHUB_REPO="${{ secrets.NEXT_PUBLIC_GITHUB_REPO }}" \
              NEXT_PUBLIC_API_BASE_URL="$API_FQDN" \
            --output json

          # Poll for FQDN
          DASH_FQDN=""
          for i in $(seq 1 18); do
            DASH_FQDN=$(az container show \
              --name ${{ env.DASHBOARD_NAME }} \
              --resource-group ${{ env.AZURE_RG }} \
              --query "ipAddress.fqdn" \
              --output tsv 2>/dev/null || true)
            if [ -n "$DASH_FQDN" ] && [ "$DASH_FQDN" != "null" ]; then
              break
            fi
            sleep 5
          done

          echo ""
          echo "════════════════════════════════════════════"
          echo "  ✅ DASHBOARD DEPLOYED"
          echo "  🌐 http://${DASH_FQDN}:3000"
          echo "  📡 API:     ${API_FQDN}"
          echo "════════════════════════════════════════════"

  # ==========================================
  # Job 9: Generate Version Report
  # ==========================================
  generate-report:
    name: Generate Version Report
    runs-on: ubuntu-latest
    needs: [train-model, deploy-api, deploy-dashboard]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download trained models
        uses: actions/download-artifact@v4
        with:
          name: trained-models
          path: .

      - name: Download training logs
        uses: actions/download-artifact@v4
        with:
          name: training-logs
          path: .

      - name: Generate version report
        run: |
          cat > MODEL_VERSION_REPORT.md << EOF
          # Model Version Report

          ## Commit ${{ needs.train-model.outputs.commit_sha }}

          **Date:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          **Pipeline Run:** ${{ github.run_id }}
          **Branch:** ${{ github.ref }}

          ## Model Performance
          | Metric | Value |
          |--------|-------|
          | CV F1 Score (mean) | ${{ needs.train-model.outputs.cv_f1_mean }} |
          | CV F1 Score (std)  | ${{ needs.train-model.outputs.cv_f1_std }} |
          | Quality Gate       | ${{ needs.train-model.outputs.quality_gate }} |

          ## Data Version
          - **Git Commit:** ${{ needs.train-model.outputs.data_hash }}

          ## Deployment
          - **API Image:**      ${{ env.AZURE_ACR_LOGIN_SERVER }}/${{ env.API_NAME }}:${{ github.sha }}
          - **Dashboard Image:** ${{ env.AZURE_ACR_LOGIN_SERVER }}/${{ env.DASHBOARD_NAME }}:${{ github.sha }}
          - **API URL:**       ${{ needs.deploy-api.outputs.api_url }}

          ## GitHub Actions
          - **Run URL:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF

      - name: Upload version report
        uses: actions/upload-artifact@v4
        with:
          name: model-version-report
          path: MODEL_VERSION_REPORT.md
          retention-days: 90
