# MLOps CI/CD Pipeline
name: MLOps Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'

jobs:
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: `${'{'}env.PYTHON_VERSION{'}'}
      - run: pip install flake8
      - run: flake8 src/ api/ tests/ --max-line-length=120 || true

  validate-data:
    name: Validate Data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: `${'{'}env.PYTHON_VERSION{'}'}
      - run: pip install pandas numpy
      - run: python src/generate_dataset.py

  train-model:
    name: Train Model
    runs-on: ubuntu-latest
    needs: [lint, validate-data]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: `${'{'}env.PYTHON_VERSION{'}'}
      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: `${'{'}runner.os{'}'}-pip-${'{'}hashFiles("requirements*.txt"){'}'}
      - run: pip install -r requirements.txt
      - run: python src/generate_dataset.py
      - name: Train model
        run: python src/train.py 2>&1 | tee training_output.log
      - name: Verify quality gate
        run: |
          if grep -q "QUALITY GATE PASSED" training_output.log; then
            echo "Quality gate PASSED"
          else
            echo "Quality gate FAILED"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: models/
          retention-days: 30

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: train-model
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: `${'{'}env.PYTHON_VERSION{'}'}
      - run: pip install -r requirements.txt pytest requests
      - uses: actions/download-artifact@v4
        with:
          name: trained-model
          path: models/
      - name: Build and test
        run: |
          docker build -t order-prediction-api .
          docker run -d -p 8000:8000 order-prediction-api
          sleep 10
          curl -f http://localhost:8000/health
          pytest tests/ -v || true
      - if: always()
        run: docker stop $(docker ps -aq) || true

  build:
    name: Build Docker
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: trained-model
          path: models/
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: order-prediction-api:latest
