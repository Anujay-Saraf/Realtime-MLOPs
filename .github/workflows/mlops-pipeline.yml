# MLOps CI/CD Pipeline for Order Prediction API
name: MLOps Pipeline

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/order-prediction-api
  PYTHON_VERSION: '3.11'

jobs:
  # ==========================================
  # Job 1: Code Quality & Linting
  # ==========================================
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install linting tools
        run: |
          pip install flake8 black isort mypy

      - name: Run flake8 linting
        run: |
          flake8 src/ api/ tests/ --max-line-length=120 --statistics || true

      - name: Check code formatting
        run: |
          black --check --diff src/ api/ tests/ || true

      - name: Check import sorting
        run: |
          isort --check-only --diff src/ api/ tests/ || true

  # ==========================================
  # Job 2: Data Validation
  # ==========================================
  validate-data:
    name: Validate Data
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install pandas numpy

      - name: Validate dataset
        run: |
          python -c "
          import pandas as pd
          import os
          
          # Generate data if not exists
          if not os.path.exists('data/orders.csv'):
              print('Generating sample dataset...')
              import subprocess
              subprocess.run(['python', 'src/generate_dataset.py'])
          
          df = pd.read_csv('data/orders.csv')
          
          # Check schema
          required_cols = [
              'region', 'channel', 'service_type', 'plan_type', 'customer_type',
              'address_verified', 'network_available', 'inventory_available',
              'credit_check_passed', 'installation_required',
              'monthly_charge', 'previous_failed_orders', 'order_result'
          ]
          
          missing = [c for c in required_cols if c not in df.columns]
          if missing:
              raise ValueError(f'Missing columns: {missing}')
          
          print(f'Data validation: {len(df)} rows, {len(df.columns)} columns')
          print(f'Class distribution:')
          print(df['order_result'].value_counts())
          
          if len(df) < 1000:
              raise ValueError('Dataset too small')
          
          print('Data validation: PASSED')
          "

  # ==========================================
  # Job 3: Model Training with K-Fold CV
  # ==========================================
  train-model:
    name: Train Model
    runs-on: ubuntu-latest
    needs: [lint, validate-data]
    outputs:
      cv_f1_mean: ${{ steps.train.outputs.cv_f1_mean }}
      quality_gate: ${{ steps.train.outputs.quality_gate }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-train-${{ hashFiles('requirements*.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt tqdm

      - name: Generate dataset
        run: python src/generate_dataset.py

      - name: Train model with K-Fold Cross-Validation
        id: train
        run: |
          echo "Starting model training with 5-fold CV..."
          python src/train.py 2>&1 | tee training_output.log

          # Extract CV F1 from the summary line printed by train.py
          CV_F1=$(grep -oE "CV F1 Score: [0-9.]+" training_output.log | tail -1 | awk '{print $4}')
          echo "cv_f1_mean=${CV_F1}" >> "$GITHUB_OUTPUT"

          if grep -q "QUALITY GATE PASSED" training_output.log; then
            echo "quality_gate=PASSED" >> "$GITHUB_OUTPUT"
          else
            echo "quality_gate=FAILED" >> "$GITHUB_OUTPUT"
          fi

      - name: Display training results
        run: |
          echo "CV F1 Score: ${{ steps.train.outputs.cv_f1_mean }}"
          echo "Quality Gate: ${{ steps.train.outputs.quality_gate }}"

      - name: Check quality gate
        if: steps.train.outputs.quality_gate != 'PASSED'
        run: |
          echo "Quality gate failed! Model does not meet minimum requirements."
          exit 1

      - name: Upload trained model
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: |
            models/order_prediction_model.joblib
            data/orders.csv
          retention-days: 30

  # ==========================================
  # Job 4: Unit & Integration Tests
  # ==========================================
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    needs: train-model
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -r requirements.txt pytest requests

      - name: Download trained model
        uses: actions/download-artifact@v4
        with:
          name: trained-model
          path: models/

      - name: Download dataset
        uses: actions/download-artifact@v4
        with:
          name: trained-model
          path: data/

      - name: Run unit tests
        run: pytest tests/ -v || true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker compose build

      - name: Start services
        run: docker compose up -d

      - name: Wait for services
        run: sleep 15

      - name: Run integration tests
        run: python test_api_and_monitoring.py || true

      - name: Stop services
        if: always()
        run: docker compose down

  # ==========================================
  # Job 5: Build & Push Docker Image
  # ==========================================
  build-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download trained model
        uses: actions/download-artifact@v4
        with:
          name: trained-model
          path: models/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          VERSION=$(echo "${{ github.sha }}" | cut -c1-8)
          REF="${{ github.ref }}"
          TAGS="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}"
          if [ "${REF}" = "refs/heads/main" ]; then
            TAGS="${TAGS},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          fi
          if [[ "${REF}" == refs/tags/v* ]]; then
            VERSION_TAG="${REF#refs/tags/}"
            TAGS="${TAGS},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION_TAG}"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Display image info
        run: |
          echo "Docker image pushed successfully"
          echo "Tags: ${{ steps.meta.outputs.tags }}"

  # ==========================================
  # Job 6: Deploy to Staging (Manual Trigger)
  # ==========================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-push]
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: http://staging.example.com:8000
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Azure Container Instances
        uses: azure/CLI@v2
        with:
          azcliversion: latest
          inlineScript: |
            echo "Deploying to Staging Environment"
            echo "Image: ${{ needs.build-push.outputs.image_tag }}"
            # Add Azure deployment commands:
            # az container create --resource-group rg-mlops-staging ...
            echo "Staging deployment complete"

  # ==========================================
  # Job 7: Deploy to Production (On Main Branch)
  # ==========================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-push]
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: http://production.example.com:8000
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Azure Container Instances
        uses: azure/CLI@v2
        with:
          azcliversion: latest
          inlineScript: |
            echo "Deploying to Production Environment"
            echo "Image: ${{ needs.build-push.outputs.image_tag }}"
            echo "Commit: ${{ github.sha }}"
            # Add Azure deployment commands:
            # az container create --resource-group rg-mlops-prod ...
            echo "Production deployment complete"

            # Health check
            # curl -f http://your-api-url/health || exit 1

  # ==========================================
  # Job 8: Generate Model Card
  # ==========================================
  model-card:
    name: Generate Model Card
    runs-on: ubuntu-latest
    needs: [train-model, deploy-production]
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate model card
        run: |
          cat > MODEL_CARD.md << 'EOF'
          # Model Deployment Report
          
          ## Deployment Information
          - **Date:** $(date)
          - **Commit:** ${{ github.sha }}
          - **Branch:** ${{ github.ref }}
          - **Run ID:** ${{ github.run_id }}
          
          ## Model Performance
          - **CV F1 Score:** ${{ needs.train-model.outputs.cv_f1_mean }}
          - **Quality Gate:** ${{ needs.train-model.outputs.quality_gate }}
          - **Algorithm:** RandomForest (500 estimators)
          - **Cross-Validation:** 5-Fold Stratified
          
          ## Deployment Status
          - **Staging:** ${{ needs.deploy-staging.result }}
          - **Production:** ${{ needs.deploy-production.result }}
          
          ## Metrics Tracked
          - Accuracy, Precision, Recall, F1 Score
          - Per-fold performance variance
          - Model drift indicators
          
          EOF

      - name: Upload model card
        uses: actions/upload-artifact@v4
        with:
          name: model-card
          path: MODEL_CARD.md
          retention-days: 90
